services:
  - type: web
    name: smart-asset-management-2f5p
    runtime: node
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.16.0
      - key: JWT_SECRET
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL
        sync: false
      - key: DB_SSL_REJECT_UNAUTHORIZED
        value: "true"
      - key: DB_SSL_CA
        sync: false
      - key: DB_SYNC_ON_START
        value: "false"
      - key: SEED_DEMO_DATA
        value: "false"
      - key: FRONTEND_URL
        fromService:
          type: web
          name: smart-asset-management-3
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
  - type: web
    name: smart-asset-management-3
    runtime: static
    rootDir: frontend
    buildCommand: 'npm ci && REACT_APP_API_URL="https://${RENDER_BACKEND_HOST}/api" npm run build'
    staticPublishPath: build
    envVars:
      - key: RENDER_BACKEND_HOST
        fromService:
          type: web
          name: smart-asset-management-2f5p
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: REACT_APP_API_TIMEOUT
        value: "30000"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
